server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API is served from this same origin, so the SPA can call it with a
    # relative path. Without this the API URL has to be baked into the bundle at
    # build time, and every new address the site is reached by — localhost, a
    # LAN IP, a tunnel, a real domain — needs its own rebuild, because the
    # browser resolves that absolute URL against itself rather than the server.
    #
    # Same origin also means no CORS preflight, which is the other thing that
    # breaks when the address changes.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be large and generation can be slow; the defaults are not.
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # Uploaded media is served by the API, so it needs the same treatment.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
        access_log off;
    }

    # Every other path is handled by the SPA router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
